
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Website Link</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        .container {
            background: rgba(0, 0, 0, 0.45);
            padding: 35px 25px;
            border-radius: 15px;
            max-width: 500px;
            width: 85%;
            box-sizing: border-box;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            line-height: 1.7;
            color: #dddddd;
            margin-bottom: 25px;
        }

        .open-button {
            display: inline-block;
            padding: 13px 28px;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.25s ease;
        }

        .open-button:hover {
            background: #cccccc;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Open New Link</h1>

        <p>
            This website has been taken down because of the bla bla bla.
            <br><br>
            Here is the new website link. Click the button below to open it!
        </p>

        <a
            class="open-button"
            href="https://spacearcades.github.io/SpaceA/"
            target="_blank"
            rel="noopener noreferrer"
        >
            Open Link ↗
        </a>
    </div>
</body>
</html>
