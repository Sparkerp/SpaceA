
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Moved</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: #050608;
    color: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

/* Subtle space background */
.background {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
        radial-gradient(ellipse at 50% 100%,
            rgba(35, 43, 58, 0.25), transparent 65%),
        radial-gradient(ellipse at 10% 0%,
            rgba(40, 45, 55, 0.15), transparent 55%),
        #050608;
}

.stars {
    position: absolute;
    inset: 0;
    background-image:
        radial-gradient(1px 1px at 15% 20%, #ffffff55 50%, transparent),
        radial-gradient(1px 1px at 75% 30%, #ffffff40 50%, transparent),
        radial-gradient(1px 1px at 40% 75%, #ffffff35 50%, transparent),
        radial-gradient(1px 1px at 90% 80%, #ffffff45 50%, transparent),
        radial-gradient(1px 1px at 60% 10%, #ffffff30 50%, transparent),
        radial-gradient(1px 1px at 25% 60%, #ffffff30 50%, transparent);
    opacity: 0.5;
}

.container {
    width: 100%;
    max-width: 460px;
    padding: 38px;
    text-align: center;
    background: rgba(12, 13, 16, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 12px;
    box-shadow: 0 20px 80px #0008;
    animation: appear 0.5s ease-out;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.label {
    display: inline-block;
    margin-bottom: 24px;
    padding: 7px 11px;
    border: 1px solid #303239;
    border-radius: 5px;
    color: #b5b7bf;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

h1 {
    font-size: clamp(30px, 6vw, 38px);
    letter-spacing: -1.2px;
    font-weight: 700;
    margin-bottom: 18px;
}

p {
    color: #a7a9b1;
    font-size: 15px;
    line-height: 1.8;
}

.destination {
    margin: 26px 0 18px;
    padding: 14px;
    border: 1px solid #292b31;
    border-radius: 7px;
    background: #101115;
}

.destination-title {
    margin-bottom: 7px;
    color: #f0f0f0;
    font-size: 14px;
    font-weight: 600;
}

.destination-url {
    color: #858892;
    font-size: 12px;
    overflow-wrap: anywhere;
}

.button {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 14px 20px;
    border: 1px solid #eee;
    border-radius: 7px;
    background: #f2f2f2;
    color: #111;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: background 0.2s, transform 0.2s;
}

.button:hover {
    background: #d8d8d8;
    transform: translateY(-1px);
}

.footer {
    margin-top: 24px;
    color: #666871;
    font-size: 11px;
}

@media (max-width: 480px) {
    .container {
        padding: 28px 22px;
    }
}
</style>
</head>

<body>
<div class="background">
    <div class="stars"></div>
</div>

<main class="container">

    <div class="label">Website Update</div>

    <h1>We've moved.</h1>

    <p>
        We've created a new website and moved everything over.
        This page is here to point you to the new location.
        <br><br>
        Click below to visit the new website.
    </p>

    <div class="destination">
        <div class="destination-title">New Website</div>
        <div class="destination-url">
            spacearcades.github.io/SpaceA/
        </div>
    </div>

    <a
        class="button"
        href="https://spacearcades.github.io/SpaceA/"
        target="_blank"
        rel="noopener noreferrer"
    >
        Open Website <span aria-hidden="true">↗</span>
    </a>

    <div class="footer">
        Thanks for visiting.
    </div>

</main>
</body>
</html>
